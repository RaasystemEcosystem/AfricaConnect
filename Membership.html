<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Join AfricaConnect</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans">
  <div class="max-w-xl mx-auto mt-10 p-8 bg-white shadow-xl rounded-xl">
    <h1 class="text-2xl font-bold mb-6 text-center text-green-600">Join AfricaConnect</h1>
    <form action="#" method="POST" class="space-y-5">
      <div>
        <label class="block mb-1 font-semibold">Full Name</label>
        <input type="text" name="name" required class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">Email</label>
        <input type="email" name="email" required class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">Phone (Optional)</label>
        <input type="tel" name="phone" class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">Country</label>
        <input type="text" name="country" required class="w-full border rounded px-3 py-2" />
      </div>
      <div>
        <label class="block mb-1 font-semibold">Membership Type</label>
        <select name="type" required class="w-full border rounded px-3 py-2">
          <option value="">Select</option>
          <option>Volunteer</option>
          <option>Partner</option>
          <option>Donor</option>
          <option>Member</option>
        </select>
      </div>
      <div>
        <label class="block mb-2 font-semibold">Areas of Interest</label>
        <div class="grid grid-cols-2 gap-2 text-sm">
          <label><input type="checkbox" name="interest" value="Community Projects" class="mr-2" />Community Projects</label>
          <label><input type="checkbox" name="interest" value="Education" class="mr-2" />Education & Youth</label>
          <label><input type="checkbox" name="interest" value="Health" class="mr-2" />Health & Nutrition</label>
          <label><input type="checkbox" name="interest" value="Tech" class="mr-2" />Tech & Innovation</label>
          <label><input type="checkbox" name="interest" value="Farming" class="mr-2" />Farming & Agribusiness</label>
        </div>
      </div>
      <div>
        <label class="block mb-1 font-semibold">Why do you want to join?</label>
        <textarea name="message" rows="4" class="w-full border rounded px-3 py-2" placeholder="Optional"></textarea>
      </div>
      <button type="submit" class="w-full bg-green-600 text-white py-2 rounded hover:bg-green-700 transition">Join AfricaConnect</button>
    </form>
  </div>
</body>
</html>
